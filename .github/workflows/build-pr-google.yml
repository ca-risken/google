name: Build and Tag Container for PR Google

on: 
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  build-pr-google:
    uses: ca-risken/.github/.github/workflows/build-pr.yml@main
    with:
      runs_on: codebuild-mimosa-google-pr-runner-${{ github.run_id }}-${{ github.run_attempt }}-arm-3.0-large
      install_go_version: "1.27.3"
      golangci_lint_version: "v2.15.0"
      image_prefix: "risken-google"
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
